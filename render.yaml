services:
  - type: web
    name: san-tim-vien-app
    runtime: docker
    plan: free
    # Free tier: build via Dockerfile, no manual shell needed
    buildCommand: docker build -t stv-app .
    # Health check (Laravel /up trả về 200)
    healthCheckPath: /up
    envVars:
      - key: APP_ENV
        value: local
      - key: APP_DEBUG
        value: "true"
      - key: APP_URL
        value: https://banhang.vnsang.io.vn
      - key: APP_KEY
        generateValue: true
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: debug
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_DRIVER
        value: database
      - key: QUEUE_CONNECTION
        value: sync
      - key: DB_CONNECTION
        value: mysql
      - key: DATABASE_URL
        fromDatabase: san-tim-vien-db
      - key: CLOUDINARY_URL
        sync: false

databases:
  - name: san-tim-vien-db
    databaseName: banhang
    user: banhang
    plan: free
