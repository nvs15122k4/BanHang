; OPcache tuning for Render free tier (low CPU, limited RAM)
; These settings balance memory vs cold-start speed

opcache.enable=1
opcache.enable_cli=0

; Memory - 128MB is sweet spot for Render free 512MB RAM
opcache.memory_consumption=128
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
opcache.max_wasted_percentage=5

; Validate timestamps OFF in prod - key for speed
opcache.validate_timestamps=0
opcache.revalidate_freq=0

; Fast shutdown
opcache.fast_shutdown=1

; JIT - function-level JIT works well on Render AMD CPUs
opcache.jit_buffer_size=32M
opcache.jit=tracing

; Save comments for reflection (Laravel needs this)
opcache.save_comments=1

; Huge pages - helps a bit on Linux
opcache.huge_code_pages=1

; Preload not used (no octane), but keep hooks
; opcache.preload=/var/www/html/bootstrap/cache/preload.php